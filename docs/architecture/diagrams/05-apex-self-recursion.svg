<polyline points="252.0,582.0 252.0,619.0" fill="none" stroke="#6c8ebf" stroke-width="1.6"/><polygon points="252.0,612.0 248.2,619.0 255.8,619.0" fill="#6c8ebf" stroke="none"/>
<polyline points="482.0,757.0 428.5,757.0 428.5,752.0 375.0,752.0" fill="none" stroke="#82b366" stroke-width="1.6"/><polygon points="382.0,752.0 375.0,748.1 375.0,755.9" fill="#82b366" stroke="none"/>
<text x="58.0" y="42.4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#000000">APEX-REL-002 — Apex self-recursion detection: three successive filters, with an abstention policy</text>
<text x="58.0" y="72.3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" fill="#666666">src/analyzer/apex_analyzer_helpers.py :: _detect_self_recursive_methods</text>
<text x="208.3" y="119.3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">Apex class body</text>
<text x="94.6" y="202.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">_strip_comments_and_strings(body, keep_string_markers=True)</text><text x="103.6" y="218.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">finite state machine — blanks comments and string contents,</text><text x="138.8" y="233.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">keeps the quotes so that f('a') is not read as f()</text>
<text x="174.9" y="287.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">_extract_method_bodies(clean)</text><text x="158.8" y="303.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">regex headers + brace-depth counting</text><text x="114.0" y="318.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">→ ApexMethod(name, param_types, params_raw, body)</text>
<text x="177.7" y="379.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">_find_recursion_guards(clean)</text><text x="83.5" y="394.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">candidate guards = static non-final Boolean / Integer / Set&lt;&gt; / Map&lt;&gt;</text><text x="239.2" y="410.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">fields</text><text x="120.6" y="425.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">+ tell-tale names (isRunning, bypass, recursionGuard,</text><text x="192.0" y="440.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">TriggerBypass.skipAll…)</text>
<text x="148.0" y="482.3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#000000">for each method with len(name) &gt;= 3</text>
<text x="500.0" y="147.7" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">FILTER (c) — guard</text><text x="500.0" y="178.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">_body_is_guarded(method.body, guards)</text><text x="500.0" y="193.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Does THIS method actually READ a guard</text><text x="500.0" y="209.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">in an if / while, or via contains( ?</text><text x="500.0" y="239.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">A field declared but never tested protects nothing.</text><text x="500.0" y="255.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Evaluated per method: a guard set in another</text><text x="500.0" y="270.6" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">method does not excuse this one.</text>
<text x="500.0" y="338.7" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">FILTER (a) — receiver</text><text x="500.0" y="369.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">_is_self_invocation(body, call_start, class_name)</text><text x="500.0" y="400.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">COUNTS: method(...) · this.method(...) · MyClass.method(...)</text><text x="500.0" y="415.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">IGNORED: new AccountService().method(...) · svc.method(...)</text><text x="500.0" y="446.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">A same-named method on another class or instance</text><text x="500.0" y="461.6" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">is a different implementation.</text>
<text x="500.0" y="523.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">FILTER (b) — signature</text><text x="500.0" y="554.1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">_call_targets_same_signature(target, overloads, args, known_types)</text><text x="500.0" y="584.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">1. arity must match the enclosing method</text><text x="500.0" y="600.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">2. if several overloads share that arity, compare inferred types</text><text x="500.0" y="615.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">_infer_argument_type: literals, new X(), casts,</text><text x="500.0" y="630.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">local declarations, the method's own parameters</text><text x="500.0" y="646.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">3. any type returns None → ABSTAIN (report nothing)</text><text x="500.0" y="677.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">So sync(id) → sync(id, false) is delegation, not recursion.</text>
<text x="950.4" y="201.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">guard read</text><text x="939.7" y="216.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">in this method?</text>
<text x="938.8" y="381.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">self-invocation?</text><text x="953.8" y="396.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">(receiver)</text>
<text x="936.3" y="576.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">same signature?</text><text x="943.5" y="591.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">(arity + types)</text>
<text x="1122.2" y="301.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#666666">skip this method</text><text x="1134.5" y="316.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#666666">(no finding)</text>
<text x="1131.7" y="471.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#666666">next call site</text><text x="1128.6" y="486.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#666666">/ next method</text>
<text x="500.0" y="728.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#000000">REPORT the finding</text><text x="500.0" y="743.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#000000">recursive.add(method.signature)</text><text x="500.0" y="759.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#000000">e.g. walk(Id, Integer) — not just "walk",</text><text x="500.0" y="774.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#000000">because with overloads a name does not</text><text x="500.0" y="789.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#000000">identify an implementation</text>
<text x="126.9" y="559.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">for each match of \b{name}\s*\( inside method.body</text>
<text x="163.1" y="627.1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">_call_arguments(body, paren_index)</text><text x="148.0" y="642.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">balanced-paren walk, then _split_top_level</text><text x="168.5" y="657.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">(respects (), [], {} and generics &lt;&gt;)</text><text x="175.2" y="673.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">unbalanced → skip this call site</text>
<text x="171.3" y="746.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">sorted list of offending signatures</text><text x="178.9" y="761.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">→ one Finding per Apex class</text>
<text x="68.0" y="857.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">TRIG-REL-001 reuses filter (c): an after insert/update trigger doing DML on Trigger.new (or an alias) is reported only if the trigger body does not read a reentrancy guard — same _body_is_guarded logic.</text>
<text x="68.0" y="916.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">Design principle: the analyzer is lexical — no AST, no data-flow analysis. Every filter is therefore written to be conservative, and an undecidable case makes the rule stay silent rather than guess. A rule that cries wolf gets switched off,</text><text x="68.0" y="931.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">and a rule nobody trusts is worth less than no rule at all.</text>
</svg>