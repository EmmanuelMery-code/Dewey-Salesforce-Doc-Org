<polyline points="977.0,537.0 977.0,516.0 1162.0,516.0 1162.0,495.0" fill="none" stroke="#b85450" stroke-width="1.6"/><polygon points="1162.0,502.0 1158.2,495.0 1165.8,495.0" fill="#b85450" stroke="none"/><rect x="1126.0" y="509.0" width="72.0" height="12" fill="#ffffff" stroke="none"/><text x="1162.0" y="518.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#b85450">no / undecidable</text><rect x="1141.5" y="520.0" width="41.0" height="12" fill="#ffffff" stroke="none"/><text x="1162.0" y="529.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#b85450">(abstain)</text>
