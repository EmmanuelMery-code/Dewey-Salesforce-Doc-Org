<polyline points="932.0,600.0 932.0,623.0" fill="none" stroke="#82b366" stroke-width="1.6"/><polygon points="932.0,616.0 928.1,623.0 935.9,623.0" fill="#82b366" stroke="none"/>
<text x="58.0" y="42.4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#000000">APEX-REL-003 — call cycles between Apex classes: Tarjan's strongly connected components</text>
<text x="58.0" y="72.3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" fill="#666666">src/analyzer/engine_call_graph.py :: _detect_apex_call_cycles → _find_cycles</text>
<text x="70.0" y="98.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#555555">Phase 1 — build the graph (a heuristic over-approximation)</text>
<text x="236.6" y="137.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">keep Apex artifacts with kind == "class"</text><text x="221.6" y="152.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">(triggers excluded); require &gt;= 2 class names</text>
<text x="225.0" y="203.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">_strip_comments_and_strings(artifact.body)</text>
<text x="146.3" y="255.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">IDENTIFIER_RE.findall(stripped), keep those matching a known class name</text><text x="184.0" y="270.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">mentioned.discard(artifact.name) ← removes self-references</text>
<text x="172.4" y="323.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">graph: dict[str, set[str]] — ClassName → {referenced ClassName}</text>
<text x="88.0" y="380.1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Caveat worth stating in any report: an edge means "class A mentions class B somewhere in its</text><text x="88.0" y="395.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">source", including a type declaration or a variable type — not "a method of A calls a method of B". The</text><text x="88.0" y="410.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">graph over-approximates the real call graph, so a reported cycle means the classes reference each</text><text x="88.0" y="426.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">other, not that they call each other at runtime.</text>
<text x="660.0" y="98.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#555555">Phase 2 — Tarjan SCC: one depth-first pass, O(V + E)</text>
<text x="755.2" y="137.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">state per node: index (discovery order) · lowlink (lowest index reachable)</text><text x="827.4" y="152.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">plus an explicit stack and an on_stack map</text>
<text x="740.2" y="203.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">strongconnect(node): assign index = lowlink = counter++, push, mark on_stack</text>
<text x="680.0" y="253.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">for each neighbour:</text><text x="680.0" y="269.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">unvisited → recurse, then lowlink[node] = min(lowlink[node], lowlink[neighbour])</text><text x="680.0" y="284.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">on the stack → lowlink[node] = min(lowlink[node], index[neighbour])</text>
<text x="792.9" y="331.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#000000">lowlink[node] == index[node] → node is an SCC root:</text><text x="766.6" y="346.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#000000">pop the stack down to node, that popped set is one component</text>
<text x="678.0" y="397.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">emit the component if len &gt;= 2.</text><text x="678.0" y="413.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">The len == 1 self-loop branch is dead code: discard(artifact.name) in phase 1 means no node ever has an</text><text x="678.0" y="428.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">edge to itself.</text>
<text x="70.0" y="503.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#555555">Worked example</text>
<text x="133.8" y="584.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">AccountService</text>
<text x="344.7" y="584.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">ContactService</text>
<text x="244.6" y="694.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">OrderService</text>
<text x="511.3" y="694.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Utils</text>
<text x="78.0" y="741.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#555555">SCC = {AccountService, ContactService, OrderService} → size 3, reported.</text><text x="78.0" y="757.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#555555">Utils has no path back, so it is not part of any component.</text>
<text x="660.0" y="503.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#555555">Output — one Finding per class in the cycle</text>
<text x="680.0" y="541.1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">for each class in the sorted component:</text><text x="680.0" y="556.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">message = "forms a call cycle with the other members"</text><text x="680.0" y="571.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">details = the member list + the chain label</text><text x="680.0" y="587.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">A -&gt; B -&gt; C -&gt; A</text>
<text x="762.5" y="635.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">returned as dict[class name → list[Finding]], which the engine merges</text><text x="790.5" y="650.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">into AnalyzerReport.apex and re-sorts by (severity, rule id)</text>
<text x="678.0" y="703.1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">Why Tarjan rather than enumerating cycles? Tarjan finds every strongly connected component in a single</text><text x="678.0" y="718.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">DFS pass, linear in nodes plus edges. Enumerating individual cycles (Johnson's algorithm) is exponential</text><text x="678.0" y="733.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">in the number of cycles and would report the same tangle of classes many times over. One SCC per</text><text x="678.0" y="749.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">tangle is also the more actionable output.</text>
</svg>