<text x="58.0" y="42.4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#000000">Mode A — SalesforceDocumentationGenerator.generate(): 11 synchronous steps on a worker thread</text>
<text x="142.0" y="80.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#555555">UI thread — Tkinter</text>
<text x="447.2" y="80.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#555555">Worker thread — daemon, synchronous pipeline</text>
<text x="984.8" y="80.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#555555">Artifacts written to disk</text>
<text x="133.2" y="121.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">app.py → Application (tk.Tk)</text><text x="124.0" y="137.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">8 mixins: UI, settings, language,</text><text x="112.6" y="152.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">SF CLI, doc task, generation, CLI, AI</text>
<text x="135.6" y="218.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">TaskManager.start_task(...)</text><text x="138.7" y="233.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">refuses if a worker is alive</text>
<text x="185.5" y="321.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Queue</text><text x="149.3" y="336.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">("log", "done", "error")</text>
<text x="119.7" y="422.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Application.after(150, poll_queue)</text><text x="119.5" y="437.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">drains the queue on the Tk thread</text>
<text x="153.2" y="504.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">log pane + progress</text><text x="145.0" y="519.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">+ success / error dialog</text>
<text x="86.0" y="589.1" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" font-style="italic" fill="#000000">Every downstream module receives</text><text x="86.0" y="604.5" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" font-style="italic" fill="#000000">log_callback = task_manager.queue_log.</text><text x="86.0" y="619.8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" font-style="italic" fill="#000000">That is why the parser and the</text><text x="86.0" y="635.2" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" font-style="italic" fill="#000000">orchestrator never import Tkinter.</text>
<text x="86.0" y="689.1" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" font-style="italic" fill="#000000">app.py --action X --silent</text><text x="86.0" y="704.5" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" font-style="italic" fill="#000000">hides the window, runs the same</text><text x="86.0" y="719.8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" font-style="italic" fill="#000000">pipeline synchronously, then</text><text x="86.0" y="735.2" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" font-style="italic" fill="#000000">sys.exit(app.cli_exit_code)</text>
<text x="484.1" y="125.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">1 — Parse: SalesforceMetadataParser.parse()</text>
<text x="471.2" y="187.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">2 — Enrich: config, test coverage, debt, innovations</text>
<text x="488.9" y="249.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">3 — Excel workbooks + data-model diagram</text>
<text x="477.7" y="311.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">4 — Reviews: review_apex_artifact / review_flow</text>
<text x="516.0" y="373.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">5 — PMD (optional, PmdService)</text>
<text x="410.6" y="435.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#000000">6 — Analyze: RuleCatalog.load() → AnalyzerEngine.analyze_snapshot()</text>
<text x="487.5" y="497.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">7 — Findings Excel / SARIF export (optional)</text>
<text x="448.6" y="559.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">8 — Metrics: AI usage, data model, selected usage, adoption</text>
<text x="504.6" y="621.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">9 — Word: data dictionary + summary</text>
<text x="489.2" y="683.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">10 — HTML: ~30 pages via html/renderers/*</text>
<text x="497.4" y="745.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">11 — History: HistoryService.add_entry()</text>
<text x="401.0" y="803.5" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" font-style="italic" fill="#000000">Each writer runs inside _safe_run: one failing writer logs and is skipped, it does not abort</text><text x="580.0" y="818.8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" font-style="italic" fill="#000000">the run.</text>
<text x="979.9" y="125.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">MetadataSnapshot (in memory)</text>
<text x="902.5" y="246.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">*.xlsx — inventory, security, picklists, data dictionary, PSG, debt</text><text x="1005.8" y="261.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">+ data model .drawio</text>
<text x="933.4" y="311.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">ReviewResult per Apex class / Flow (prose advice)</text>
<text x="934.1" y="435.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">AnalyzerReport — 11 dicts of name → list[Finding]</text>
<text x="933.8" y="497.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Dewey_Findings_*.xlsx · report.sarif (SARIF 2.1.0)</text>
<text x="968.5" y="621.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">*.docx — data dictionary + summary</text>
<text x="927.7" y="675.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">html/ — index, findings, debt, adoption, methodology,</text><text x="918.1" y="690.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">listings, one page per object / Apex / Flow / Omni / profile</text>
<text x="938.7" y="742.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">history.db (SQLite) — feeds the trend dashboard</text><text x="985.1" y="757.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">and the run-comparison page</text>
</svg>