<text x="58.0" y="42.4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#000000">From a &lt;rule&gt; element to a Finding — and the four gates that can suppress it</text>
<text x="70.0" y="83.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#555555">A — Load the catalog (once per run)</text>
<text x="133.8" y="128.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">src/analyzer/rules.xml</text><text x="139.9" y="144.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">52 &lt;rule&gt; elements</text><text x="96.2" y="159.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">French text + &lt;translation lang="en"&gt;</text>
<text x="392.1" y="128.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Mode B alternative:</text><text x="377.1" y="144.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">DeweyRule__c via SOQL</text><text x="396.4" y="159.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">(SfConfigService)</text>
<text x="246.5" y="222.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">load_rules(path, language)</text><text x="172.9" y="238.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">_localized_child: use the &lt;translation&gt; child if non-empty,</text><text x="204.9" y="253.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">otherwise fall back to French — never blank</text>
<text x="156.6" y="307.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">RuleCatalog — all · enabled · get(id) · for_scope(scope) · t(key)</text><text x="126.3" y="322.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">disabled rules stay in the catalog, so each analyzer must check rule.enabled</text>
<text x="630.0" y="83.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#555555">B — Facts already computed by the parser</text>
<text x="650.0" y="130.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">MetadataSnapshot</text><text x="650.0" y="161.1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">ApexArtifact.query_in_loop / dml_in_loop / callout_in_loop</text><text x="650.0" y="176.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">ApexArtifact.line_count / comment_line_count / system_debug_count</text><text x="650.0" y="191.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">FlowInfo.soql_in_loop / dml_in_loop / api_call_in_loop / max_depth</text><text x="650.0" y="207.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">FlowInfo.unprotected_fault_elements</text><text x="650.0" y="222.6" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">ValidationRuleInfo.complexity_score</text><text x="650.0" y="237.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">SecurityArtifact permission bags · CustomizationMetrics counts</text>
<text x="841.8" y="294.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">GATE 1 — metadata exclusion</text><text x="782.7" y="310.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">the component was dropped from the snapshot entirely</text><text x="765.1" y="325.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">(exclusion_mixin.py, 3-tier glob / substring / normalized match)</text>
<text x="70.0" y="403.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#555555">C — Evaluate, per artifact</text>
<text x="148.9" y="442.1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">AnalyzerEngine.analyze_snapshot()</text><text x="83.5" y="457.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">walks Apex → Flows → Objects/VR → Duplicate rules → Omni</text><text x="229.7" y="472.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">DT</text><text x="129.1" y="488.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">→ Agents/Prompts → LWC/Aura → Security</text>
<text x="190.2" y="532.1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">per-scope analyzer</text><text x="119.2" y="547.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">apex_analyzer · flow_analyzer · object_analyzer</text><text x="114.4" y="562.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">lwc_analyzer · aura_analyzer · security_analyzer ·</text><text x="201.2" y="578.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">omni_analyzer</text>
<text x="158.3" y="629.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">one independent check per rule:</text><text x="186.7" y="645.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">rule = catalog.get(id)</text><text x="113.0" y="660.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">if rule and rule.enabled and &lt;condition on the fact&gt;</text>
<text x="522.8" y="553.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">GATE 2</text><text x="507.7" y="569.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">rule disabled?</text><text x="503.7" y="584.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">enabled="false"</text>
<text x="690.0" y="541.1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">GATE 3 + 4 — _is_rule_applicable(rule, name, api_version)</text><text x="690.0" y="571.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">3. name in rule_exclusions[rule.id] → suppressed</text><text x="690.0" y="587.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">4. api_version outside [min_api_version, max_api_version] → suppressed</text>
<text x="688.0" y="637.5" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" font-style="italic" fill="#000000">Known asymmetry: SEC-001…SEC-005 bypass this gate — profiles and permission sets are passed straight to</text><text x="688.0" y="652.8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" font-style="italic" fill="#000000">the security analyzer, so JSON exclusions and API-version windows have no effect on them.</text>
<text x="154.4" y="724.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#000000">Finding(rule, target_kind, target_name, message, details, source_path, line)</text><text x="161.9" y="739.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#000000">message built through catalog.t(key, **params) — localized at the source</text>
<text x="803.7" y="724.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">_sorted: sort by (SEVERITY_ORDER[severity], rule.id)</text><text x="794.2" y="739.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Critical 0 · Major 1 · Minor 2 · Info 3 — deterministic output</text>
<text x="310.4" y="834.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">AnalyzerReport — apex · flows · objects · validation_rules · duplicate_rules · data_transforms · agents · prompts · lwc · aura · security</text><text x="393.6" y="850.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">keys: component name, except "Object.RuleName" for VR/DR and the sentinel "_org_" for SEC-005</text><text x="452.0" y="865.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">helpers: all_findings() · severity_counts() · rule_counts() · category_counts()</text>
</svg>