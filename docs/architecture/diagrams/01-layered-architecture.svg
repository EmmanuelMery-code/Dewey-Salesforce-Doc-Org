<text x="58.0" y="41.8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#000000">Dewey — layered architecture (dependencies point downward)</text>
<text x="70.0" y="80.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#555555">1 — Entry points</text>
<text x="209.0" y="118.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">app.py</text><text x="160.0" y="134.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">Tkinter desktop (Mode A)</text>
<text x="520.3" y="118.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">assess.py</text><text x="464.0" y="134.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">headless /assess-org (Mode B)</text>
<text x="851.3" y="118.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">silent/</text><text x="799.0" y="134.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">programmatic Python API</text>
<text x="70.0" y="205.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#555555">2 — Orchestration</text>
<text x="255.3" y="243.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">src/core/orchestrator/</text><text x="155.7" y="259.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">SalesforceDocumentationGenerator.generate() — 11 steps</text>
<text x="701.6" y="243.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">src/core/orchestrator_headless.py</text><text x="661.0" y="259.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">HeadlessOrchestrator.run() → AssessmentResult</text>
<text x="70.0" y="330.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#555555">3 — Domain: parse first, then judge</text>
<text x="126.3" y="371.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">src/parsers/salesforce_parser/</text><text x="111.2" y="388.3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">8 mixins — XML / Apex / JS → facts</text><text x="125.6" y="405.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">applies METADATA exclusions</text>
<text x="386.6" y="388.3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" fill="#000000">MetadataSnapshot</text>
<text x="638.0" y="375.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">src/analyzer/</text><text x="572.1" y="392.3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">AnalyzerEngine + 52 rules (rules.xml)</text><text x="605.6" y="409.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">applies RULE exclusions</text>
<text x="870.6" y="380.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" fill="#000000">AnalyzerReport</text><text x="885.3" y="396.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="italic" fill="#000000">(Findings)</text>
<text x="268.6" y="457.3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">src/core/customization_metrics/ — 9 weighted capabilities → AdoptionStats (Adopt / Adapt posture)</text>
<text x="70.0" y="530.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#555555">4 — Shared model</text>
<text x="247.7" y="564.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">src/core/models/ — typed dataclasses: ObjectInfo, ApexArtifact, FlowInfo, SecurityArtifact, LwcInfo, Dependency, CustomizationMetrics…</text><text x="241.3" y="580.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#000000">the only behaviour here is computed scoring (FlowInfo.complexity_score, CustomizationMetrics.score, ValidationRuleInfo.complexity_score)</text>
<text x="70.0" y="650.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#555555">5 — Presentation &amp; side services</text>
<text x="157.4" y="686.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">src/reporting/</text><text x="146.6" y="702.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">HTML site, Excel,</text><text x="138.5" y="717.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Word, SARIF, drawio</text>
<text x="404.8" y="686.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">src/ui/</text><text x="374.5" y="702.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Tkinter Application</text><text x="373.8" y="717.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">8 mixins + screens</text>
<text x="602.9" y="686.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">src/ai/ (optional)</text><text x="599.5" y="702.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Claude / Gemini /</text><text x="620.3" y="717.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Gateway</text>
<text x="823.1" y="686.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">src/reviewers/</text><text x="819.4" y="702.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">heuristics.py →</text><text x="805.9" y="717.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">ReviewResult advice</text>
<text x="1013.0" y="694.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">history_service.py</text><text x="1015.2" y="709.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">SQLite history.db</text>
<text x="181.3" y="760.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">sf_config_service.py — reads DeweyRule__c / DeweyConfig__c / DeweyExclusion__c</text><text x="159.5" y="775.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">sf_findings_service*.py — pushes OrgAnalysis__c / Finding__c / AnalysisDelta__c (with dedup)</text>
<text x="781.5" y="760.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">sf_cli_service*.py — subprocess wrapper around the `sf` CLI</text><text x="780.6" y="775.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">(manifest, retrieve, org list, Tooling-API coverage, Apex tests)</text>
<text x="73.0" y="852.3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#000000">Legend</text>
<text x="102.5" y="879.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">shared by both modes</text>
<text x="297.5" y="879.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Mode A only (desktop)</text>
<text x="489.2" y="879.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Mode B only (headless)</text>
<text x="683.4" y="879.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Mode A + partly Mode B</text>
<text x="853.0" y="876.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">Invariant: layers 3 and 4 import no UI and no reporting code —</text><text x="853.0" y="891.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">that is what makes Mode B possible.</text>
</svg>