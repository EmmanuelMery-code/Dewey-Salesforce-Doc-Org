<text x="58.0" y="42.4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#000000">Mode B — assess.py: configuration comes from Salesforce, results go back to Salesforce</text>
<text x="850.0" y="85.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#8a6d00">Salesforce org (--org, default ag2rPoc)</text>
<text x="880.0" y="148.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Configuration objects (read)</text><text x="880.0" y="179.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">DeweyRule__c — rule definitions</text><text x="880.0" y="194.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">DeweyConfig__c — thresholds &amp; weights</text><text x="880.0" y="209.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">DeweyExclusion__c — per-component exclusions</text>
<text x="880.0" y="478.1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Result objects (written per run)</text><text x="880.0" y="508.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">OrgAnalysis__c — scores, counts, status</text><text x="880.0" y="524.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Finding__c — one per violation,</text><text x="880.0" y="539.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">with IsNew__c / IsResolved__c</text><text x="880.0" y="554.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">AnalysisDelta__c — diff vs previous run</text><text x="880.0" y="570.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">DeweyPosture__c — adoption posture</text>
<text x="880.0" y="316.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">Tooling API (optional --coverage)</text><text x="880.0" y="331.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">ApexCodeCoverageAggregate, FlowTestCoverage</text>
<text x="192.5" y="89.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">assess.py</text><text x="115.8" y="105.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">--org --source --branch --scope --analyzer</text><text x="129.9" y="120.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">--pmd-ruleset --coverage --run-tests</text>
<text x="154.3" y="179.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">1 — SfConfigService(org)</text><text x="98.3" y="195.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">`sf data query` → RuleCatalog built from the org,</text><text x="173.3" y="210.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">not from rules.xml</text>
<text x="158.3" y="269.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">2 — Resolve the source</text><text x="169.3" y="285.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">local SFDX path, or</text><text x="132.9" y="300.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">`git clone --depth 1` into a temp dir</text>
<text x="144.2" y="362.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">3 — Optional: run_apex_tests</text><text x="135.6" y="377.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">then fetch_test_coverage (sf CLI)</text>
<text x="430.0" y="178.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#555555">4 — HeadlessOrchestrator.run()</text>
<text x="533.5" y="215.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">parse → MetadataSnapshot</text><text x="540.2" y="230.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">(same parser as Mode A)</text>
<text x="516.0" y="279.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">compute_adoption_stats(snapshot)</text>
<text x="516.6" y="331.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">apply_test_coverage(...) if supplied</text>
<text x="508.1" y="379.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#000000">AnalyzerEngine.analyze_snapshot()</text><text x="554.5" y="394.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#000000">→ AnalyzerReport</text>
<text x="550.7" y="439.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">--analyzer pmd | sfca</text><text x="500.1" y="454.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">inject external violations as extra Findings</text>
<text x="564.4" y="499.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">filter by --scope</text><text x="519.5" y="514.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">(all | apex | flows | security | omni)</text>
<text x="495.2" y="563.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">AssessmentResult(snapshot, report, scope)</text>
<text x="430.0" y="650.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">5 — SfFindingsService.push(...)</text><text x="430.0" y="681.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">reuse existing Finding__c records</text><text x="430.0" y="696.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">create the genuinely new ones</text><text x="430.0" y="712.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">mark vanished ones as resolved</text><text x="430.0" y="727.6" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">→ (analysis_id, delta_summary)</text>
<text x="139.6" y="669.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">6 — Print the terminal summary</text><text x="119.4" y="685.2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">global score, top 5 critical findings, delta</text><text x="151.2" y="700.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#000000">then rmtree the temp clone</text>
<text x="68.0" y="776.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">No report writers, no Tkinter, no SQLite history: Mode B reuses the parser, the analyzer engine and the shared models, and replaces the whole</text><text x="68.0" y="791.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">presentation layer with Salesforce Custom Objects.</text>
<text x="848.0" y="756.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">Mode B never retrieves metadata from the org: it analyzes a local or freshly</text><text x="848.0" y="771.7" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">cloned DX tree. The `sf` CLI is used only for configuration SOQL, coverage</text><text x="848.0" y="787.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#000000">and Apex tests.</text>
</svg>